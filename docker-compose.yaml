services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      php:
        condition: service_started
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@database:3306/${MYSQL_DATABASE:-rental_pricing}?serverVersion=8.4.0&charset=utf8mb4
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - php_vendor:/app/vendor
      - php_cache:/app/var/cache

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rental_pricing}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-app}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  frontend_node_modules:
  mysql_data:
  php_vendor:
  php_cache:
